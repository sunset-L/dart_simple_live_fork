name: TV 端 Android 手动/开发构建

# 文件名沿用旧仓库；仅构建 Artifacts，不创建或更新 GitHub Release。
on:
  workflow_dispatch:
  push:
    tags:
      - "dev_tv_v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # 不固定 dev/master，手动运行使用选中的分支，标签构建使用标签对应的提交。
      - name: 签出当前提交
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 构建 Android 安装包
        id: build
        uses: ./.github/actions/build-android
        with:
          app-directory: simple_live_tv_app
          keystore-base64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.TV_STORE_PASSWORD }}
          key-password: ${{ secrets.TV_KEY_PASSWORD }}
          key-alias: ${{ secrets.TV_KEY_ALIAS }}

      - name: 上传 APK 到 Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: simple-live-tv-${{ steps.build.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.build.outputs.package-directory }}/*.apk
          if-no-files-found: error
          retention-days: 14
